[package]
name = "rabbit"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
rayon = "1"
tiny_http = "0.12"

# io_uring is Linux-only; the expert-loading fallback path (sequential pread via
# safetensors.rs) covers every other target, so this dependency is never required elsewhere.
[target.'cfg(target_os = "linux")'.dependencies]
io-uring = "0.7"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "kernels"
harness = false

[[bench]]
name = "expert_load"
harness = false
