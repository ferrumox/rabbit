[package]
name = "rabbit"
version = "0.23.0"
edition = "2024"
description = "A Rust inference engine for GLM-5.2, Kimi Linear, and Kimi K3 (2.8T-parameter MoE), streaming routed experts from disk on demand"
repository = "https://github.com/ferrumox/rabbit"
readme = "README.md"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
rayon = "1"
tiny_http = "0.12"
num_cpus = "1"
# Kimi Linear's tokenizer (tokenization_kimi.py) pre-tokenizes with a Unicode SET INTERSECTION
# pattern (`\p{Lu}...&&[^\p{Han}]]`) that Rust's plain `regex` crate doesn't support -- confirmed
# `fancy-regex` does (same crate family real tiktoken's own Rust core uses). See
# src/kimi_linear/tokenizer.rs's module doc.
fancy-regex = "0.13"
# tiktoken.model's on-disk format is `<base64-encoded-bytes> <rank>` per line.
base64 = "0.22"
ureq = { version = "3.3.0", features = ["json"] }

# io_uring is Linux-only; the expert-loading fallback path (sequential pread via
# safetensors.rs) covers every other target, so this dependency is never required elsewhere.
[target.'cfg(target_os = "linux")'.dependencies]
io-uring = "0.7"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "kernels"
harness = false

[[bench]]
name = "expert_load"
harness = false

# Added 2026-07-31 for the Kimi K3 target-box performance work (see PERFORMANCE.md's Phase 0
# section). thin LTO + a single codegen unit let the optimizer inline across the hand-written
# `is_x86_feature_detected!` kernel dispatchers and their `#[target_feature]` inner fns, which
# 16 codegen units + no LTO (the compiler defaults this crate shipped with) leave on the table.
# Deliberately NOT set: `panic = "abort"` (the `--serve` accept loop relies on unwinding a
# panicked request thread without killing the process) and `target-cpu=native` (open decision D1:
# kept out of the committed build so binaries stay portable across the owner's machines; measured
# separately via RUSTFLAGS, see PERFORMANCE.md).
[profile.release]
lto = "thin"
codegen-units = 1
